workflows:
  ios-unsigned:
    name: Sign iOS Unsigned APP
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Prepare Flutter iOS build
        script: |
          flutter build ios --release --no-codesign --config-only

      - name: Build iOS APP without signing
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/ios/iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Create ZIP containing APP only
        script: |
          cd build/ios/iphoneos
          test -d Sign.app
          zip -r Sign.app.zip Sign.app

    artifacts:
      - build/ios/iphoneos/Sign.app.zip
