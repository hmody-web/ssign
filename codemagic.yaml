workflows:
  ios-unsigned:
    name: Sign iOS Unsigned APP
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Prepare Flutter iOS build
        script: |
          flutter build ios --release --no-codesign --config-only

      - name: Build iOS APP without signing
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/ios/iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Create ZIP containing APP only
        script: |
          cd build/ios/iphoneos
          test -d Booma.app
          zip -r Booma.app.zip Booma.app

    artifacts:
      - build/ios/iphoneos/Booma.app.zip

  ios-signed:
    name: Build Signed iOS APP
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: development
        bundle_identifier: com.sbooma.sign

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Prepare Flutter iOS build
        script: |
          flutter build ios --release --config-only

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
